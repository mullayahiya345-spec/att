{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
  <div class="col-lg-5 col-md-7">
    <div class="card p-4 shadow-sm">
      <h2 class="fw-bold mb-3 text-center">Student Login</h2>
      <p class="text-muted text-center mb-4">Access your attendance dashboard.</p>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button class="btn btn-primary w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
